<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #081b29;
            color: white;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 100px;
        }

        button {
            padding: 10px;
            margin: 5px;
            width: 50px;
            background: cyan;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder="Num 1">
<input type="number" id="num2" placeholder="Num 2"><br>

<button onclick="calc('+')">+</button>
<button onclick="calc('-')">-</button>
<button onclick="calc('*')">*</button>
<button onclick="calc('/')">/</button>

<p id="result"></p>

<script>
function calc(op) {
    let n1 = parseFloat(document.getElementById("num1").value);
    let n2 = parseFloat(document.getElementById("num2").value);
    let result;

    if(op == '+') result = n1 + n2;
    if(op == '-') result = n1 - n2;
    if(op == '*') result = n1 * n2;
    if(op == '/') result = n1 / n2;

    document.getElementById("result").innerHTML = "Result: " + result;
}
</script>

</body>
</html>
