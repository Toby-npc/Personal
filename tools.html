<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - Projek Saya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Portfolio</a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="personalinfo.html">About</a>
            <a href="tools.html" class="active">Tools</a>
        </nav>
    </header>

    <div class="tools-container">
        <div class="tool-card">
            <h2>Kalkulator</h2>
            <input type="number" id="n1" placeholder="Nombor 1">
            <input type="number" id="n2" placeholder="Nombor 2">
            <button onclick="cal('+')">+</button>
            <button onclick="cal('-')">-</button>
            <p id="res-c">Hasil: 0</p>
        </div>

        <div class="tool-card">
            <h2>BMI Checker</h2>
            <input type="number" id="w" placeholder="Berat (kg)">
            <input type="number" id="h" placeholder="Tinggi (m)">
            <button onclick="bmi()">Kira</button>
            <p id="res-b">Hasil: -</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
