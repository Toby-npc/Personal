<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - Projek Saya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Portfolio</a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="personalinfo.html">About</a>
            <a href="tools.html" class="active">Tools</a>
        </nav>
    </header>

    <div class="tools-container">
        <div class="tool-card">
            <h2>Kalkulator Standard</h2>
            <input type="text" id="display" class="calc-screen" readonly placeholder="0">
            <div class="calc-buttons">
                <button class="btn btn-calc" onclick="clearDisplay()" style="background:#ff4d4d">C</button>
                <button class="btn btn-calc" onclick="addToDisplay('/')">÷</button>
                <button class="btn btn-calc" onclick="addToDisplay('*')">×</button>
                <button class="btn btn-calc" onclick="backspace()">←</button>
                
                <button class="btn btn-calc" onclick="addToDisplay('7')">7</button>
                <button class="btn btn-calc" onclick="addToDisplay('8')">8</button>
                <button class="btn btn-calc" onclick="addToDisplay('9')">9</button>
                <button class="btn btn-calc" onclick="addToDisplay('-')">-</button>
                
                <button class="btn btn-calc" onclick="addToDisplay('4')">4</button>
                <button class="btn btn-calc" onclick="addToDisplay('5')">5</button>
                <button class="btn btn-calc" onclick="addToDisplay('6')">6</button>
                <button class="btn btn-calc" onclick="addToDisplay('+')">+</button>
                
                <button class="btn btn-calc" onclick="addToDisplay('1')">1</button>
                <button class="btn btn-calc" onclick="addToDisplay('2')">2</button>
                <button class="btn btn-calc" onclick="addToDisplay('3')">3</button>
                <button class="btn btn-calc" onclick="calculateResult()" style="background:#28a745">=</button>
                
                <button class="btn btn-calc" style="grid-column: span 2;" onclick="addToDisplay('0')">0</button>
                <button class="btn btn-calc" onclick="addToDisplay('.')">.</button>
            </div>
        </div>
        <div class="tool-card">
            <h2>BMI Checker</h2>
            <input type="number" id="w" placeholder="Berat (kg)">
            <input type="number" id="h" step="0.01" placeholder="Tinggi (m) Contoh: 1.65">
            <button class="btn" style="width:100%" onclick="bmi()">Kira BMI</button>
            <p id="res-b" class="res">Hasil: -</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
