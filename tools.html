<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Tools - Projek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Portfolio</a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="personalinfo.html">About</a>
            <a href="tools.html" class="active">Tools</a>
        </nav>
    </header>

    <div class="tools-container">
        <div class="tool-card">
            <h2>BMI Checker</h2>
            <input type="number" id="w" placeholder="Berat (kg)">
            <input type="number" id="h" placeholder="Tinggi (m)">
            <button class="btn" onclick="bmi()">Kira BMI</button>
            <p id="res-b" class="res">Hasil: -</p>
        </div>

        <div class="tool-card">
            <h2>Kalkulator</h2>
            <input type="number" id="n1" placeholder="Nombor 1">
            <input type="number" id="n2" placeholder="Nombor 2">
            <div style="display:flex; justify-content:center; gap:10px;">
                <button class="btn" onclick="cal('+')">+</button>
                <button class="btn" onclick="cal('-')">-</button>
            </div>
            <p id="res-c" class="res">Hasil: 0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
